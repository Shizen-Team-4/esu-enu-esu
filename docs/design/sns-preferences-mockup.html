<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather – Preferences</title>
<style>
:root{--blue:#1a56ff;--ink:#14161a;--mute:#6b7280;--line:#e5e7eb;--soft:#f3f6ff;--bg:#f8f8f9;--card:#fff;--field:#fff}
:root[data-theme="dark"]{--ink:#f2f3f5;--mute:#9aa0aa;--line:#2a2d34;--soft:#18233f;--bg:#0f1115;--card:#16181d;--field:#1d2025}
@media(prefers-color-scheme:dark){:root[data-theme="system"]{--ink:#f2f3f5;--mute:#9aa0aa;--line:#2a2d34;--soft:#18233f;--bg:#0f1115;--card:#16181d;--field:#1d2025}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Helvetica Neue",Arial,"Noto Sans Khmer","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);font-size:13px;min-height:100vh}
button,select{font:inherit;color:inherit}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line)}
header a{color:var(--ink);display:flex}
header svg{width:18px;height:18px}
header b{font-size:16px}
.page{max-width:520px;margin:28px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px}
.row+.row{border-top:1px solid var(--line)}
.row b{display:block;font-size:13px}
.row small{color:var(--mute);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;background:var(--field);overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;color:var(--mute)}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span{background:var(--soft);color:var(--blue);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:-2px}
select{background:var(--field);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:12px;min-width:140px;cursor:pointer}
select:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 3px rgba(26,86,255,.18)}
.status{margin-top:10px;min-height:16px;font-size:11px;color:var(--mute);text-align:right}
@media(max-width:480px){.row{flex-direction:column;align-items:flex-start;gap:10px}.seg{width:100%}.seg label{flex:1}.seg span{justify-content:center}select{width:100%}header{padding:0 14px}}
</style>
</head>
<body>
<header>
  <a href="#" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
  <b>Preferences</b>
</header>

<main class="page">
  <section class="card">
    <div class="row">
      <div><b>Theme</b><small>Match your device or pick one.</small></div>
      <div class="seg" role="radiogroup" aria-label="Theme">
        <label><input type="radio" name="theme" value="system" checked><span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</span></label>
        <label><input type="radio" name="theme" value="light"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Light</span></label>
        <label><input type="radio" name="theme" value="dark"><span><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Dark</span></label>
      </div>
    </div>
    <div class="row">
      <div><b>Language</b><small>Used across menus and buttons.</small></div>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="km">ខ្មែរ</option>
        <option value="ja">日本語</option>
      </select>
    </div>
  </section>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<script>
const root=document.documentElement,status=document.getElementById('status');let t;
function saved(){status.textContent='Saved';clearTimeout(t);t=setTimeout(()=>status.textContent='',1800)}
root.dataset.theme='system';
document.querySelectorAll('[name=theme]').forEach(r=>r.addEventListener('change',()=>{root.dataset.theme=r.value;saved()}));
document.getElementById('lang').addEventListener('change',e=>{root.lang=e.target.value;saved()});
</script>
</body>
</html>
