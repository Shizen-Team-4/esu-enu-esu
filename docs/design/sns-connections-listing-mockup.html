<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather – Followers and following</title>
<style>
:root{--blue:#1a56ff;--ink:#14161a;--mute:#6b7280;--line:#e5e7eb;--soft:#f3f6ff;--bg:#fff;--field:#f8f8f9}
:root[data-theme="dark"]{--ink:#f2f3f5;--mute:#9aa0aa;--line:#2a2d34;--soft:#18233f;--bg:#0f1115;--field:#1d2025}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f3f5;--mute:#9aa0aa;--line:#2a2d34;--soft:#18233f;--bg:#0f1115;--field:#1d2025}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;border-bottom:1px solid var(--line)}
header a{display:flex}
header b{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:14px 0;color:var(--mute);font-size:12px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button span{font-weight:400;margin-left:4px}
.tabs .on{color:var(--ink);border-color:var(--blue)}

.search{display:flex;align-items:center;gap:10px;margin:16px 0 6px;padding:10px 12px;background:var(--field);border:1px solid var(--line);border-radius:3px;color:var(--mute)}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,255,.18)}
.search svg{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}

ul{list-style:none}
li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%}
.nm{min-width:0}
.nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mute);font-size:11px}
.btn{min-width:92px;padding:8px 14px;border-radius:3px;font-size:12px;font-weight:600;border:1px solid var(--blue);background:var(--blue);color:#fff}
.btn:hover{background:#0f45e0}
.btn.on{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.on:hover{background:var(--soft);border-color:var(--blue);color:var(--blue)}
.empty{text-align:center;color:var(--mute);padding:48px 0;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
@media(max-width:480px){header{padding:0 14px}.btn{min-width:84px}}
</style>
</head>
<body>
<header>
  <a href="gather-profile.html" aria-label="Back to profile"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
  <b>@nak</b>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tf" data-t="followers">Followers<span id="cf"></span></button>
    <button role="tab" id="tg" data-t="following">Following<span id="cg"></span></button>
  </div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search people" aria-label="Search people"></label>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<script>
// f = I follow them. followers list shows who follows me; following list shows who I follow.
const colors=['#a83a44','#3b4fa0','#777','#2fa6a0','#6a4b8a','#c27a2c','#3a7a52'];
const mk=(n,h,i,f)=>({n,h,c:colors[i%colors.length],f});
const data={
  followers:[mk('Maya Chen','mayachen',0,true),mk('Lena Park','lenapark',1,false),mk('James Wilson','jameswilson',2,true),mk('Nina Patel','ninapatel',3,false),mk('Theo Brandt','theob',4,false),mk('Sora Tanaka','soratanaka',5,true)],
  following:[mk('Maya Chen','mayachen',0,true),mk('James Wilson','jameswilson',2,true),mk('Sora Tanaka','soratanaka',5,true),mk('Photo Club','photoclub',6,true)]
};
let tab=location.hash==='#following'?'following':'followers';
const $=id=>document.getElementById(id);

function render(){
  $('tf').classList.toggle('on',tab==='followers');$('tg').classList.toggle('on',tab==='following');
  $('tf').setAttribute('aria-selected',tab==='followers');$('tg').setAttribute('aria-selected',tab==='following');
  $('cf').textContent=data.followers.length;$('cg').textContent=data.following.filter(p=>p.f).length;
  const q=$('q').value.trim().toLowerCase();
  const rows=data[tab].filter(p=>!q||p.n.toLowerCase().includes(q)||p.h.includes(q));
  $('list').innerHTML=rows.map(p=>{
    const label=p.f?'Following':(tab==='followers'?'Follow back':'Follow');
    return `<li><i class="av" style="background:${p.c}"></i><div class="nm"><b>${p.n}</b><small>@${p.h}</small></div><button class="btn ${p.f?'on':''}" data-h="${p.h}">${label}</button></li>`}).join('');
  const none=!rows.length;$('empty').hidden=!none;
  if(none)$('empty').innerHTML=q?`<b>No results</b>Try a different name or username.`:tab==='followers'?`<b>No followers yet</b>Share your profile to get started.`:`<b>You're not following anyone</b>Find people to follow on Home.`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;history.replaceState(null,'','#'+tab);$('q').value='';render()}));
$('q').addEventListener('input',render);
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const h=b.dataset.h;
  [...data.followers,...data.following].filter(p=>p.h===h).forEach(p=>p.f=!p.f); // keep both lists in sync
  render();
});
render();
</script>
</body>
</html>
